version: '3.8'

services:
  medicore-health-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicore-health-os
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - API_PREFIX=/api/v1
    volumes:
      - medicore-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  medicore-logs:
    driver: local
